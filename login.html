<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Smart Earthworm Farm</title>

    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

    <div class="split-screen">
        <div class="left-side">
            <div class="brand-text">
                <h1>Smart Earthworm Farm</h1>
                <p>ระบบควบคุมและติดตามสภาพแวดล้อมฟาร์มไส้เดือนอัจฉริยะ</p>
            </div>
        </div>

        <div class="right-side">
            <div class="register-container" id="loginBox">
                <h2>เข้าสู่ระบบ</h2>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="identifier">อีเมล / ชื่อผู้ใช้ / เบอร์โทรศัพท์</label>
                        <input type="text" id="identifier" placeholder="กรอกอีเมล, Username หรือเบอร์โทร" required>
                    </div>
                    <div class="form-group">
                        <label for="password">รหัสผ่าน (Password)</label>
                        <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
                    </div>
                    <button type="submit">ล็อกอิน</button>
                </form>

                <div class="link-container">
                    <a href="./index.html">สมัครสมาชิกที่นี่</a>
                    <a href="./forgot-password.html">ลืมรหัสผ่าน</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 🔔 กล่อง Custom Alert ป๊อปอัพสีสวยงาม -->
    <div id="customAlert" class="custom-alert">
        <span id="alertIcon">🔔</span>
        <span id="alertMessage">ข้อความแจ้งเตือน</span>
    </div>

    <script type="module">
        import { handleLogin, showCustomAlert } from "./src/login.js";

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const identifier = document.getElementById("identifier").value;
            const password = document.getElementById("password").value;

            const submitBtn = e.target.querySelector("button");
            submitBtn.innerText = "กำลังตรวจสอบ...";
            submitBtn.disabled = true;

            const result = await handleLogin(identifier, password);

            if (result.success) {
                // 🟢 ล็อกอินสำเร็จ: แสดง Toast สวยๆ แทน alert()
                showCustomAlert("เข้าสู่ระบบสำเร็จ! กำลังพาท่านเข้าสู่ระบบ...", "success");

                // หน่วงเวลา 1.2 วินาทีเพื่อให้ป๊อปอัพเด้งโชว์ก่อนเปลี่ยนหน้า
                setTimeout(() => {
                    if (result.data && result.data.role === "admin") {
                        window.location.href = "./admin.html";
                    } else {
                        window.location.href = "./dashboard.html";
                    }
                }, 1200);
            } else {
                // 🔴 ล็อกอินไม่สำเร็จ: โชว์ป๊อปอัพข้อผิดพลาด และคืนค่าปุ่ม
                showCustomAlert(result.error || "ชื่อผู้ใช้ไม่ถูกต้องหรือรหัสผ่านไม่ถูกต้อง!", "error");
                submitBtn.innerText = "ล็อกอิน";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
