<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - ฟาร์มไส้เดือนอัจฉริยะ</title>
    <link rel="stylesheet" href="./css/style.css"> </head>
<body>
    <div class="forgot-container">
        <h2>🔒 ลืมรหัสผ่าน</h2>
        <p>กรอกอีเมลของคุณเพื่อรับลิงก์สำหรับตั้งรหัสผ่านใหม่</p>
        
        <form id="forgot-form">
            <div class="input-group">
                <label for="forgot-email">อีเมลที่ใช้สมัครสมาชิก:</label>
                <input type="email" id="forgot-email" required placeholder="example@gmail.com">
            </div>
            <button type="submit" class="btn-submit">ส่งอีเมลรีเซ็ตรหัสผ่าน</button>
        </form>

        <div class="links">
            <a href="/login.html">กลับไปหน้าเข้าสู่ระบบ</a>
        </div>
    </div>

    <script type="module" src="./src/forgot-password.js"></script>
</body>
</html>
